<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Edgars Arena</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://fav.farm/⚽">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(22, 34, 64, 0.95);
      --pitch-green: #1b8a3e;
      --pitch-stripe: #157333;
      --accent-yellow: #fbc02d;
      --accent-orange: #f57c00;
      --accent-cyan: #00e5ff;
      --accent-green: #2e7d32;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 10%, #1c2b54 0%, #070a14 100%);
    }

    #app-container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top), 6px) 12px max(env(safe-area-inset-bottom), 10px) 12px;
      position: relative;
    }
