<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Edgars Fußball-Arena</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://fav.farm/⚽">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(22, 34, 64, 0.95);
      --pitch-green: #1b8a3e;
      --pitch-stripe: #157333;
      --accent-yellow: #fbc02d;
      --accent-orange: #f57c00;
      --accent-cyan: #00e5ff;
      --accent-red: #d32f2f;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 10%, #1c2b54 0%, #070a14 100%);
    }

    #app-container {
      width: 100%;
      max-width: 420px;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 6px) 10px env(safe-area-inset-bottom, 8px) 10px;
      position: relative;
    }

    /* Top Stats */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 38px;
      padding: 0 4px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.85rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1rem;
    }

    /* Spielfeld */
    #pitch-container {
      flex: 1;
      min-height: 140px;
      max-height: 220px;
      background: repeating-linear-gradient(
        0deg,
        var(--pitch-green),
        var(--pitch-green) 24px,
        var(--pitch-stripe) 24px,
        var(--pitch-stripe) 48px
      );
      border-radius: 16px;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.4);
      margin-bottom: 6px;
    }

    #goal {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      height: 60px;
      border: 3px solid #ffffff;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0, rgba(255,255,255,0.08) 7px, transparent 7px, transparent 14px);
    }

    #keeper {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      transition: left 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    #ball {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translate(-50%, 50%);
      font-size: 1.9rem;
      z-index: 3;
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Aufgabenteil */
    #task-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      margin-bottom: 6px;
    }

    .task-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #90caf9;
      font-weight: 900;
      margin-bottom: 2px;
    }

    .question {
      font-family: 'Fredoka', cursive;
      font-size: 1.8rem;
      color: var(--accent-yellow);
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .answer-display {
      font-family: 'Fredoka', cursive;
      font-size: 1.4rem;
      min-height: 34px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      margin-top: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      background: rgba(0, 0, 0, 0.2);
    }

    /* Nummernblock */
    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 2px;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: white;
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.35);
    }

    .key-submit {
      background: linear-gradient(180deg, #00e676 0%, #00b0ff 100%);
      color: #0b1329;
      font-weight: 900;
      border: none;
    }

    .key-clear {
      background: rgba(211, 47, 47, 0.3);
      color: #ff8a80;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="top-bar">
      <div class="badge">🎃 <span id="stars-count">0</span></div>
      <div class="badge">🔥 <span id="goals-count">0</span> Tore</div>
      <button class="icon-btn" id="audio-btn">🔊</button>
    </div>

    <div id="pitch-container">
      <div id="goal"></div>
      <div id="keeper">🦆</div>
      <div id="ball">⚽</div>
    </div>

    <div id="task-container">
      <div class="task-label">Löse den Power-Schuss:</div>
      <div class="question" id="task-q">4 × 10</div>
      <div class="answer-display" id="task-a">?</div>
    </div>

    <div id="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn key-clear" onclick="pressKey('C')">C</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn key-submit" onclick="pressKey('OK')">➔</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    let goals = 0;
    let stars = 0;
    let currentInput = "";
    let n1 = 4, n2 = 10, correctAnswer = 40;
    let audioEnabled = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration) {
      if (!audioEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function newTask() {
      n1 = Math.floor(Math.random() * 9) + 2;
      n2 = Math.floor(Math.random() * 9) + 2;
      correctAnswer = n1 * n2;
      document.getElementById('task-q').innerText = `${n1} × ${n2}`;
      currentInput = "";
      document.getElementById('task-a').innerText = "?";
      
      const keeper = document.getElementById('keeper');
      keeper.style.left = "50%";
      const ball = document.getElementById('ball');
      ball.style.transition = 'none';
      ball.style.bottom = "12px";
      ball.style.left = "50%";
      ball.style.transform = "translate(-50%, 50%) scale(1)";
      setTimeout(() => { ball.style.transition = 'all 0.45s cubic-bezier(0.25, 1, 0.5, 1)'; }, 20);
    }

    function pressKey(val) {
      if (val === 'C') {
        currentInput = "";
        document.getElementById('task-a').innerText = "?";
        playTone(220, 'sine', 0.1);
      } else if (val === 'OK') {
        checkResult();
      } else {
        if (currentInput.length < 3) {
          currentInput += val;
          document.getElementById('task-a').innerText = currentInput;
          playTone(440, 'triangle', 0.08);
        }
      }
    }

    function checkResult() {
      const userAns = parseInt(currentInput, 10);
      if (isNaN(userAns)) return;

      const ball = document.getElementById('ball');
      const keeper = document.getElementById('keeper');

      if (userAns === correctAnswer) {
        goals++;
        stars += 2;
        document.getElementById('goals-count').innerText = goals;
        document.getElementById('stars-count').innerText = stars;

        const targetX = Math.random() > 0.5 ? 28 : 72;
        const keeperX = targetX > 50 ? 25 : 75;

        keeper.style.left = keeperX + "%";
        ball.style.bottom = "140px";
        ball.style.left = targetX + "%";
        ball.style.transform = "translate(-50%, 50%) scale(0.65)";

        playTone(523, 'sine', 0.15);
        setTimeout(() => playTone(659, 'sine', 0.2), 120);
        setTimeout(() => playTone(784, 'sine', 0.35), 240);

        setTimeout(newTask, 1000);
      } else {
        keeper.style.left = "50%";
        ball.style.bottom = "120px";
        ball.style.left = "50%";
        ball.style.transform = "translate(-50%, 50%) scale(0.7)";

        playTone(200, 'sawtooth', 0.25);
        setTimeout(() => playTone(150, 'sawtooth', 0.3), 150);

        currentInput = "";
        document.getElementById('task-a').innerText = "❌";
        setTimeout(() => {
          document.getElementById('task-a').innerText = "?";
          ball.style.bottom = "12px";
          ball.style.transform = "translate(-50%, 50%) scale(1)";
        }, 800);
      }
    }

    document.getElementById('audio-btn').onclick = () => {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-btn').innerText = audioEnabled ? '🔊' : '🔇';
    };
  </script>
</body>
</html>
