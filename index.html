<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Edgars Arena</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://fav.farm/⚽">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(22, 34, 64, 0.95);
      --pitch-green: #1b8a3e;
      --pitch-stripe: #157333;
      --accent-yellow: #fbc02d;
      --accent-cyan: #00e5ff;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 10%, #1c2b54 0%, #070a14 100%);
    }

    #app-container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top), 6px) 12px max(env(safe-area-inset-bottom), 10px) 12px;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 28px;
      flex-shrink: 0;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .view.active {
      display: flex;
    }

    /* Hauptmenü */
    .hero-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      margin: 4px 0;
      flex-shrink: 0;
    }

    .avatar-glow {
      width: 52px;
      height: 52px;
      margin: 0 auto 4px auto;
      background: radial-gradient(circle, #ff80ab 20%, rgba(255,128,171,0.2) 70%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 16px rgba(255,128,171,0.4);
    }

    .hero-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      color: var(--accent-yellow);
    }

    .hero-sub {
      font-size: 0.72rem;
      font-weight: 900;
      color: #90caf9;
      margin-bottom: 4px;
    }

    .speech-bubble {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 0.7rem;
      line-height: 1.2;
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 4px 0;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 12px;
      border: none;
      color: white;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }

    .mode-btn:active {
      transform: scale(0.98);
    }

    .mode-math {
      background: linear-gradient(135deg, #1b8a3e 0%, #157333 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .mode-eng {
      background: linear-gradient(135deg, #e65100 0%, #bf360c 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .mode-icon {
      font-size: 1.6rem;
    }

    .mode-info h3 {
      font-family: 'Fredoka', cursive;
      font-size: 1rem;
    }

    .mode-info p {
      font-size: 0.68rem;
      opacity: 0.85;
    }

    .bottom-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 4px;
      color: rgba(255, 255, 255, 0.75);
      flex-shrink: 0;
    }

    .rank-text {
      color: var(--accent-yellow);
    }

    .reset-link {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.65rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
      text-align: center;
    }

    /* Game View */
    .back-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      margin: 2px 0;
      flex-shrink: 0;
    }

    #pitch-container {
      flex: 1 1 auto;
      min-height: 60px;
      max-height: 120px;
      background: repeating-linear-gradient(
        0deg,
        var(--pitch-green),
        var(--pitch-green) 14px,
        var(--pitch-stripe) 14px,
        var(--pitch-stripe) 28px
      );
      border-radius: 10px;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      margin: 2px 0 4px 0;
    }

    #goal {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 38px;
      border: 2px solid #ffffff;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0, rgba(255,255,255,0.08) 5px, transparent 5px, transparent 10px);
    }

    #keeper {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.45rem;
      transition: left 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    #ball {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translate(-50%, 50%);
      font-size: 1.25rem;
      z-index: 3;
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #task-container {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 4px 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .task-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #90caf9;
      font-weight: 900;
    }

    .question {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      color: var(--accent-yellow);
      letter-spacing: 1px;
      line-height: 1.1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .speak-inline {
      background: none;
      border: none;
      color: #00e5ff;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .answer-display {
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      min-height: 24px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      margin-top: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      background: rgba(0, 0, 0, 0.2);
    }

    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .key-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: white;
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.35);
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .key-submit {
      background: linear-gradient(180deg, #00e676 0%, #00b0ff 100%);
      color: #0b1329;
      font-weight: 900;
      border: none;
    }

    .key-clear {
      background: rgba(211, 47, 47, 0.35);
      color: #ff8a80;
    }

    #choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: white;
      font-family: 'Fredoka', cursive;
      font-size: 0.95rem;
      min-height: 44px;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    .choice-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="top-bar">
      <div class="badge">🎃 <span id="stars-count">0</span></div>
      <div class="badge">🔥 <span id="goals-count">0</span> Tore</div>
      <button class="icon-btn" id="audio-btn" onclick="toggleAudio()">🔊</button>
    </div>

    <!-- VIEW 1: HAUPTMENÜ -->
    <div id="view-menu" class="view active">
      <div class="hero-card">
        <div class="avatar-glow">🐷</div>
        <div class="hero-title">Edgars Arena</div>
        <div class="hero-sub">⚽ Schmahamas Kick & Learn</div>
        <div class="speech-bubble">
          „Hey Champ! Zieh dein Trikot an – heute schießen wir uns an die Tabellenspitze! 🏆“
        </div>
      </div>

      <div class="menu-buttons">
        <button class="mode-btn mode-math" onclick="startGame('math')">
          <div class="mode-icon">🥅</div>
          <div class="mode-info">
            <h3>1x1 Elfmeter-Schießen</h3>
            <p>Kleines Einmaleins mit Power-Kick!</p>
          </div>
        </button>

        <button class="mode-btn mode-eng" onclick="startGame('english')">
          <div class="mode-icon">🇬🇧</div>
          <div class="mode-info">
            <h3>Englisch-Kicker</h3>
            <p>Vokabeln 5. Klasse mit Sprachausgabe 🔊</p>
          </div>
        </button>
      </div>

      <div class="bottom-status">
        <span>Dein Rang:</span>
        <span class="rank-text" id="user-rank">Bolzplatz-Rookie 👟</span>
      </div>

      <button class="reset-link" onclick="resetAllScores()">🔄 Spielstand auf 0 setzen</button>
    </div>

    <!-- VIEW 2: SPIEL -->
    <div id="view-game" class="view">
      <button class="back-btn" onclick="goToMenu()">⬅ Zurück zum Hauptmenü</button>

      <div id="pitch-container">
        <div id="goal"></div>
        <div id="keeper">🦆</div>
        <div id="ball">⚽</div>
      </div>

      <div id="task-container">
        <div class="task-label" id="task-mode-title">Löse den Power-Schuss:</div>
        <div class="question" id="task-q">
          <span id="question-text">4 × 8</span>
          <button id="speak-btn" class="speak-inline" style="display:none;" onclick="speakCurrentWord()">🔊</button>
        </div>
        <div class="answer-display" id="task-a">?</div>
      </div>

      <!-- Nummernblock für Mathe -->
      <div id="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn key-clear" onclick="pressKey('C')">C</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn key-submit" onclick="pressKey('OK')">➔</button>
      </div>

      <!-- Multiple-Choice für Vokabeln -->
      <div id="choice-grid" style="display: none;">
        <button class="choice-btn" id="choice-0" onclick="chooseAnswer(0)"></button>
        <button class="choice-btn" id="choice-1" onclick="chooseAnswer(1)"></button>
        <button class="choice-btn" id="choice-2" onclick="chooseAnswer(2)"></button>
        <button class="choice-btn" id="choice-3" onclick="chooseAnswer(3)"></button>
      </div>
    </div>
  </div>

  <script>
    let goals = 0;
    let stars = 0;
    let currentGameMode = 'math';
    let currentInput = "";
    let correctAnswer = 0;
    let currentEnglishWord = "";
    let audioEnabled = true;

    // Umfassende Vokabeldatenbank Klasse 5 (75 zentrale Begriffe)
    const vocabulary = [
      // Schule & Lernen
      { en: "school", de: "Schule" },
      { en: "teacher", de: "Lehrer" },
      { en: "student", de: "Schüler" },
      { en: "friend", de: "Freund" },
      { en: "classroom", de: "Klassenzimmer" },
      { en: "book", de: "Buch" },
      { en: "pen", de: "Kugelschreiber" },
      { en: "pencil", de: "Bleistift" },
      { en: "ruler", de: "Lineal" },
      { en: "bag", de: "Tasche" },
      { en: "desk", de: "Schreibtisch" },
      { en: "board", de: "Tafel" },
      { en: "homework", de: "Hausaufgabe" },
      { en: "question", de: "Frage" },
      { en: "answer", de: "Antwort" },
      
      // Sport & Freizeit
      { en: "football", de: "Fußball" },
      { en: "player", de: "Spieler" },
      { en: "team", de: "Mannschaft" },
      { en: "goal", de: "Tor" },
      { en: "winner", de: "Gewinner" },
      { en: "game", de: "Spiel" },
      { en: "ball", de: "Ball" },
      { en: "match", de: "Wettkampf" },
      { en: "music", de: "Musik" },
      { en: "song", de: "Lied" },
      { en: "bike", de: "Fahrrad" },
      
      // Familie & Personen
      { en: "family", de: "Familie" },
      { en: "mother", de: "Mutter" },
      { en: "father", de: "Vater" },
      { en: "brother", de: "Bruder" },
      { en: "sister", de: "Schwester" },
      { en: "parents", de: "Eltern" },
      { en: "boy", de: "Junge" },
      { en: "girl", de: "Mädchen" },
      { en: "child", de: "Kind" },
      
      // Tiere
      { en: "dog", de: "Hund" },
      { en: "cat", de: "Katze" },
      { en: "duck", de: "Ente" },
      { en: "horse", de: "Pferd" },
      { en: "bird", de: "Vogel" },
      { en: "mouse", de: "Maus" },
      { en: "rabbit", de: "Kaninchen" },
      { en: "pig", de: "Schwein" },
      
      // Essen & Trinken
      { en: "apple", de: "Apfel" },
      { en: "bread", de: "Brot" },
      { en: "water", de: "Wasser" },
      { en: "milk", de: "Milch" },
      { en: "cheese", de: "Käse" },
      { en: "banana", de: "Banane" },
      { en: "pizza", de: "Pizza" },
      { en: "breakfast", de: "Frühstück" },
      { en: "dinner", de: "Abendessen" },
      
      // Haus & Alltag
      { en: "house", de: "Haus" },
      { en: "room", de: "Zimmer" },
      { en: "door", de: "Tür" },
      { en: "window", de: "Fenster" },
      { en: "bed", de: "Bett" },
      { en: "chair", de: "Stuhl" },
      { en: "table", de: "Tisch" },
      { en: "garden", de: "Garten" },
      { en: "street", de: "Straße" },
      
      // Wichtige Verben & Adjektive
      { en: "listen", de: "zuhören" },
      { en: "read", de: "lesen" },
      { en: "write", de: "schreiben" },
      { en: "speak", de: "sprechen" },
      { en: "play", de: "spielen" },
      { en: "run", de: "rennen" },
      { en: "happy", de: "glücklich" },
      { en: "fast", de: "schnell" },
      { en: "great", de: "großartig" },
      { en: "small", de: "klein" },
      { en: "big", de: "groß" }
    ];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration) {
      if (!audioEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-btn').innerText = audioEnabled ? '🔊' : '🔇';
    }

    function speakCurrentWord() {
      if (!audioEnabled || !currentEnglishWord || !('speechSynthesis' in window)) return;
      const utterance = new SpeechSynthesisUtterance(currentEnglishWord);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function resetAllScores() {
      goals = 0;
      stars = 0;
      document.getElementById('goals-count').innerText = "0";
      document.getElementById('stars-count').innerText = "0";
      updateRank();
      playTone(300, 'sine', 0.15);
    }

    function updateRank() {
      const rankEl = document.getElementById('user-rank');
      if (goals >= 30) rankEl.innerText = "Arena-Legende 🏆✨";
      else if (goals >= 20) rankEl.innerText = "Profi-Stürmer ⚽🔥";
      else if (goals >= 10) rankEl.innerText = "Liga-Talent 🥇";
      else rankEl.innerText = "Bolzplatz-Rookie 👟";
    }

    function startGame(mode) {
      currentGameMode = mode;
      document.getElementById('view-menu').classList.remove('active');
      document.getElementById('view-game').classList.add('active');

      if (mode === 'math') {
        document.getElementById('task-mode-title').innerText = "Löse den Power-Schuss:";
        document.getElementById('keypad').style.display = 'grid';
        document.getElementById('choice-grid').style.display = 'none';
        document.getElementById('task-a').style.display = 'flex';
        document.getElementById('speak-btn').style.display = 'none';
        nextMathTask();
      } else {
        document.getElementById('task-mode-title').innerText = "Wähle das richtige deutsche Wort:";
        document.getElementById('keypad').style.display = 'none';
        document.getElementById('choice-grid').style.display = 'grid';
        document.getElementById('task-a').style.display = 'none';
        document.getElementById('speak-btn').style.display = 'inline-block';
        nextEnglishTask();
      }
    }

    function goToMenu() {
      document.getElementById('view-game').classList.remove('active');
      document.getElementById('view-menu').classList.add('active');
      updateRank();
    }

    function resetBallAndKeeper() {
      const keeper = document.getElementById('keeper');
      keeper.style.left = "50%";
      const ball = document.getElementById('ball');
      ball.style.transition = 'none';
      ball.style.bottom = "4px";
      ball.style.left = "50%";
      ball.style.transform = "translate(-50%, 50%) scale(1)";
      setTimeout(() => { ball.style.transition = 'all 0.45s cubic-bezier(0.25, 1, 0.5, 1)'; }, 20);
    }

    /* MATHE */
    function nextMathTask() {
      const n1 = Math.floor(Math.random() * 9) + 2;
      const n2 = Math.floor(Math.random() * 9) + 2;
      correctAnswer = n1 * n2;
      document.getElementById('question-text').innerText = `${n1} × ${n2}`;
      currentInput = "";
      document.getElementById('task-a').innerText = "?";
      resetBallAndKeeper();
    }

    function pressKey(val) {
      if (val === 'C') {
        currentInput = "";
        document.getElementById('task-a').innerText = "?";
        playTone(220, 'sine', 0.08);
      } else if (val === 'OK') {
        checkMathResult();
      } else {
        if (currentInput.length < 3) {
          currentInput += val;
          document.getElementById('task-a').innerText = currentInput;
          playTone(440, 'triangle', 0.06);
        }
      }
    }

    function checkMathResult() {
      const userAns = parseInt(currentInput, 10);
      if (isNaN(userAns)) return;

      if (userAns === correctAnswer) {
        shootGoal(true, () => nextMathTask());
      } else {
        shootGoal(false, () => {
          currentInput = "";
          document.getElementById('task-a').innerText = "?";
          resetBallAndKeeper();
        });
      }
    }

    /* ENGLISCH */
    function nextEnglishTask() {
      resetBallAndKeeper();
      const current = vocabulary[Math.floor(Math.random() * vocabulary.length)];
      currentEnglishWord = current.en;
      document.getElementById('question-text').innerText = current.en;
      speakCurrentWord();

      const options = [current.de];
      while (options.length < 4) {
        const rand = vocabulary[Math.floor(Math.random() * vocabulary.length)].de;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`choice-${i}`);
        btn.innerText = options[i];
        btn.dataset.correct = (options[i] === current.de);
      }
    }

    function chooseAnswer(index) {
      const btn = document.getElementById(`choice-${index}`);
      const isCorrect = (btn.dataset.correct === "true");

      if (isCorrect) {
        shootGoal(true, () => nextEnglishTask());
      } else {
        shootGoal(false, () => {
          resetBallAndKeeper();
        });
      }
    }

    /* SCHUSS & ANIMATION */
    function shootGoal(success, callback) {
      const ball = document.getElementById('ball');
      const keeper = document.getElementById('keeper');

      if (success) {
        goals++;
        stars += 2;
        document.getElementById('goals-count').innerText = goals;
        document.getElementById('stars-count').innerText = stars;

        const targetX = Math.random() > 0.5 ? 28 : 72;
        const keeperX = targetX > 50 ? 25 : 75;

        keeper.style.left = keeperX + "%";
        ball.style.bottom = "75px";
        ball.style.left = targetX + "%";
        ball.style.transform = "translate(-50%, 50%) scale(0.65)";

        playTone(523, 'sine', 0.12);
        setTimeout(() => playTone(659, 'sine', 0.15), 100);
        setTimeout(() => playTone(784, 'sine', 0.3), 200);

        setTimeout(callback, 850);
      } else {
        keeper.style.left = "50%";
        ball.style.bottom = "60px";
        ball.style.left = "50%";
        ball.style.transform = "translate(-50%, 50%) scale(0.7)";

        playTone(200, 'sawtooth', 0.2);
        setTimeout(() => playTone(150, 'sawtooth', 0.25), 120);

        if (currentGameMode === 'math') {
          document.getElementById('task-a').innerText = "❌";
        }
        setTimeout(callback, 750);
      }
    }
  </script>
</body>
